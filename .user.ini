; ==========================================================================
; Session hardening for PHP-FPM (iTop docroot) - added 2026-10-21
; Picked up by php-fpm within user_ini.cache_ttl seconds (default 300).
; ==========================================================================
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1
session.cookie_samesite = Lax
